<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Змейка</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: sans-serif;
  }
  h1 { margin: 10px; }
  canvas {
    background: #11111b;
    border: 2px solid #89b4fa;
    border-radius: 8px;
  }
  #info { margin-top: 10px; font-size: 14px; opacity: 0.8; }
</style>
</head>
<body>
  <h1>🐍 Змейка</h1>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="info">WASD — движение (работает при любой раскладке). Пробел — рестарт.</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const CELL = 20;
const COLS = canvas.width / CELL;
const ROWS = canvas.height / CELL;

let snake, dir, nextDir, food, score, gameOver;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  placeFood();
}

function placeFood() {
  while (true) {
    const f = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) {
      food = f;
      return;
    }
  }
}

function step() {
  if (gameOver) return;

  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver = true; return;
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true; return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    placeFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#11111b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#f38ba8';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#a6e3a1' : '#94d3a2';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f38ba8';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
    ctx.fillStyle = '#cdd6f4';
    ctx.font = '18px sans-serif';
    ctx.fillText('Счёт: ' + score, canvas.width/2, canvas.height/2 + 20);
    ctx.fillText('Пробел — заново', canvas.width/2, canvas.height/2 + 45);
  } else {
    ctx.fillStyle = '#cdd6f4';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Счёт: ' + score, 10, 20);
  }
}

// e.code — физический код клавиши, работает при ЛЮБОЙ раскладке
window.addEventListener('keydown', e => {
  switch (e.code) {
    case 'KeyW':
      if (dir.y !== 1) nextDir = {x: 0, y: -1};
      break;
    case 'KeyS':
      if (dir.y !== -1) nextDir = {x: 0, y: 1};
      break;
    case 'KeyA':
      if (dir.x !== 1) nextDir = {x: -1, y: 0};
      break;
    case 'KeyD':
      if (dir.x !== -1) nextDir = {x: 1, y: 0};
      break;
    case 'Space':
      if (gameOver) reset();
      break;
  }
});

reset();
setInterval(() => { step(); draw(); }, 200);
</script>
</body>
</html>
